name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_WORKLOAD_ID: "IDWOHIKHKBBTNAXWZ7OYDDDQX4"
          OP_ENVIRONMENT_ID: "euxxlx4hif62y7chldpdgmubzy"
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          test -f .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Sync secrets to Vercel
        run: |
          for var in SUPABASE_URL SUPABASE_ANON_KEY AUTH0_SECRET AUTH0_ISSUER_BASE_URL AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET; do
            printf "%s" "${!var}" | vercel env add "$var" production --force --token="$VERCEL_TOKEN"
          done
          PROD_URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            PROD_URL="$AUTH0_BASE_URL"
          fi
          PROD_URL="${PROD_URL%/}"
          if [ -z "$PROD_URL" ] || [ "$PROD_URL" = "http://localhost:3000" ]; then
            echo "Set GitHub variable PRODUCTION_URL to your Vercel app URL, or set AUTH0_BASE_URL in 1Password to that URL."
            exit 1
          fi
          printf "%s" "$PROD_URL" | vercel env add AUTH0_BASE_URL production --force --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
